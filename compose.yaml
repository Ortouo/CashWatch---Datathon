services:
  api:
    build:
      context: .
      args:
        INSTALL_ML: "true"
    env_file: .env
    environment:
      CASHWATCH_MODEL_DIR: /models/Qwen3-VL-2B-Instruct
      CASHWATCH_DATA_DIR: /app/runtime
      CASHWATCH_RULES_PATH: /app/config/rules.json
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
    volumes:
      - ./models:/models:ro
      - ./config:/app/config:ro
      - runtime:/app/runtime
    networks:
      - inference
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
  gateway:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ingress
      - inference
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  inference:
    internal: true
  ingress: {}

volumes:
  runtime: {}

