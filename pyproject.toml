[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cashwatch-datathon"
version = "0.1.0"
description = "Local video evidence service for ForteBank Datathon 26"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.18,<1",
  "python-dotenv>=1,<2",
  "pillow>=10,<13",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
ml = [
  "torch==2.8.0",
  "torchvision==0.23.0",
  "transformers==4.57.1",
  "accelerate==1.10.1",
  "huggingface-hub==0.35.3",
]
training = ["numpy>=1.26,<3", "scikit-learn>=1.5,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cashwatch = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

